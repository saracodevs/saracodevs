    <stop offset="1" stop-color="#0D1117"/>
  </linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1600" y2="240">
    <stop stop-color="#273449"/>
    <stop offset="1" stop-color="#1F2937"/>
  </linearGradient>
</defs>

<rect width="1600" height="240" fill="transparent"/>

<!-- Card helper: x positions 20, 215, 410, 605, 800, 995, 1190, 1385 -->
