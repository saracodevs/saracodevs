<svg width="1400" height="250" viewBox="0 0 1400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="terminalBg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0B1119"/>
    <stop offset="0.72" stop-color="#0B1119"/>
    <stop offset="1" stop-color="#101A36"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1040 190) rotate(180) scale(430 170)">
    <stop stop-color="#173B88" stop-opacity=".34"/>
    <stop offset="1" stop-color="#0B1119" stop-opacity="0"/>
  </radialGradient>
  <style>
    .prompt{font:500 25px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#9B7BFF}
    .message{font:500 25px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#E5E7EB}
    .code{font:700 28px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#F8FAFC}
    .side{font:500 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#7C83A6;letter-spacing:1.5px}
  </style>
</defs>

<rect width="1400" height="250" rx="18" fill="#090D13"/>
<rect x="1" y="1" width="1398" height="248" rx="17" stroke="#253041"/>

<!-- Terminal -->
<rect x="30" y="28" width="1110" height="194" rx="14" fill="url(#terminalBg)" stroke="#334155"/>
<rect x="30" y="28" width="1110" height="194" rx="14" fill="url(#glow)"/>

<text x="70" y="100" class="prompt">&gt; sara.codevs@github:~$</text>
<text x="92" y="148" class="message">Obrigada por visitar meu perfil!</text>
<rect x="566" y="124" width="16" height="30" rx="2" fill="#8B5CF6"/>

<!-- Right signature -->
<line x1="1175" y1="28" x2="1175" y2="222" stroke="#202938"/>
<text x="1210" y="78" class="code">&lt;/&gt;</text>
<text x="1210" y="122" class="side">BUILDING</text>
<text x="1210" y="151" class="side">A BETTER ME</text>
<text x="1210" y="180" class="side">THROUGH CODE.</text>

</svg>