<svg width="1400" height="250" viewBox="0 0 1400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="panelBg" x1="0" y1="0" x2="1400" y2="250" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0D1117"/>
    <stop offset="1" stop-color="#090D13"/>
  </linearGradient>

  <linearGradient id="terminalBg" x1="40" y1="40" x2="1040" y2="210" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B1119"/>
    <stop offset="0.7" stop-color="#0B1119"/>
    <stop offset="1" stop-color="#101A36"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#7C3AED"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>

  <radialGradient id="softGlow" cx="0" cy="0" r="1" gradientTransform="translate(980 170) rotate(180) scale(360 140)" gradientUnits="userSpaceOnUse">
    <stop stop-color="#2563EB" stop-opacity="0.25"/>
    <stop offset="0.45" stop-color="#1D4ED8" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#0B1119" stop-opacity="0"/>
  </radialGradient>

  <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feColorMatrix in="blur" type="matrix"
      values="1 0 0 0 0.49
              0 1 0 0 0.23
              0 0 1 0 0.93
              0 0 0 0.32 0"/>
  </filter>

  <style>
    .prompt{font:600 25px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#9B7BFF}
    .message{font:600 25px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#F3F4F6}
    .sub{font:500 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#7C83A6}
    .code{font:700 28px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#F8FAFC}
    .side{font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#7C83A6;letter-spacing:1.6px}
  </style>
</defs>

<rect width="1400" height="250" rx="18" fill="url(#panelBg)"/>
<rect x="1" y="1" width="1398" height="248" rx="17" stroke="#253041"/>

<!-- terminal area -->
<rect x="30" y="28" width="1115" height="194" rx="14" fill="url(#terminalBg)" stroke="#334155"/>
<rect x="30" y="28" width="1115" height="194" rx="14" fill="url(#softGlow)"/>

<!-- top terminal dots -->
<circle cx="62" cy="48" r="4.5" fill="#F87171"/>
<circle cx="80" cy="48" r="4.5" fill="#FBBF24"/>
<circle cx="98" cy="48" r="4.5" fill="#34D399"/>

<!-- prompt / text -->
<text x="72" y="98" class="prompt">&gt; sara.codevs@github:~$</text>
<text x="92" y="146" class="message">Obrigada por visitar meu perfil!</text>
<text x="92" y="185" class="sub">see you again._</text>

<!-- cursor -->
<rect x="597" y="121" width="14" height="32" rx="2" fill="#8B5CF6" filter="url(#purpleGlow)"/>

<!-- divider -->
<line x1="1175" y1="28" x2="1175" y2="222" stroke="#202938"/>

<!-- signature -->
<text x="1210" y="78" class="code">&lt;/&gt;</text>
<text x="1210" y="120" class="side">BUILDING</text>
<text x="1210" y="149" class="side">A BETTER ME</text>
<text x="1210" y="178" class="side">THROUGH CODE.</text>

<!-- subtle accent lines -->
<line x1="46" y1="206" x2="114" y2="206" stroke="url(#accent)" stroke-width="2"/>
<line x1="30" y1="238" x2="1370" y2="238" stroke="#202938"/>
</svg>
